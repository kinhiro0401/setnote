<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SETNOTE</title>
<meta name="theme-color" content="#0D0E0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SETNOTE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%23D4FF3A'/%3E%3Cg transform='translate(16 16) scale(.73)'%3E%3Cg transform='skewX(-12) translate(14 0)' fill='%230D0E0B'%3E%3Crect x='20' y='24' width='13' height='72' rx='3'/%3E%3Crect x='41' y='24' width='13' height='72' rx='3'/%3E%3Crect x='62' y='24' width='13' height='72' rx='3'/%3E%3Crect x='83' y='24' width='13' height='72' rx='3'/%3E%3C/g%3E%3Cpath d='M8 88L112 34' stroke='%23F4F5EE' stroke-width='13' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* デザインの正: design/DESIGN.md と design/screens/*.html
   1〜3章の色・文字・余白・角丸をここで定数化。アクセントは --accent の1か所で差し替える
   （候補: #D4FF3A / #FF7A45 / #6CCBFF / #F4F5EE） */
:root{
  --accent:#D4FF3A;
  --bg:#0D0E0B;--surface:#181A15;--surface-raised:#22241D;--track:#2C2F26;--bar-muted:#3A3D32;
  --text:#F4F5EE;--text-muted:#A3A69A;--on-accent:#0D0E0B;
  --pad-x:24px;--pad-top:max(calc(env(safe-area-inset-top) + 8px),24px);
  --r-card:24px;--r-field:16px;--r-row:14px;--r-bar:8px;
  --tabbar-h:72px;
  --font:"Space Grotesk","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
/* アプリらしい操作感: 文字選択・長押しメニュー・引っぱりスクロール・ダブルタップ拡大を止める */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
button,a.icon-btn,a.btn-primary,#tabbar a{transition:transform .08s,opacity .08s}
button:active,a.icon-btn:active,a.btn-primary:active{transform:scale(.97);opacity:.8}#tabbar a:active{opacity:.6}
@media (prefers-reduced-motion:no-preference){main.enter{animation:enter .18s ease-out}@keyframes enter{from{opacity:0;transform:translateY(8px)}}}
#inst{position:fixed;left:12px;right:12px;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px);z-index:9;display:none;gap:12px;align-items:center;padding:14px 8px 14px 16px;border-radius:var(--r-field);background:var(--text);color:var(--on-accent);font-size:13px;line-height:18px;font-weight:500;max-width:512px;margin:0 auto}
#inst.show{display:flex}#inst b{font-weight:700}#inst button{flex:none;width:44px;height:44px;border:0;background:none;color:var(--on-accent);font-size:20px;cursor:pointer}
body{margin:0;background:var(--bg);color:var(--text);font:500 15px/20px var(--font);overflow-x:clip}
button,input,select,textarea{font-family:inherit}
a{color:var(--text);text-decoration:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:2px}
svg.i{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ステータスバーの下に内容が透けないようにする */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:20}
/* 画面の枠 */
main{max-width:560px;margin:0 auto;padding:var(--pad-top) var(--pad-x) calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px)}

/* タイポグラフィ（2章） */
.t-num{font-size:52px;line-height:60px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.t-menu{font-family:"Noto Sans JP",var(--font);font-size:30px;line-height:36px;font-weight:900;margin:0}
.t-title{font-family:"Noto Sans JP",var(--font);font-size:28px;line-height:36px;font-weight:900;margin:0}
.t-section{font-size:14px;line-height:20px;font-weight:700;margin:0}
.t-sub{font-size:13px;line-height:18px;color:var(--text-muted)}
.t-label{font-size:12px;line-height:16px;font-weight:700}
.t-min{font-size:11px}

/* 共通部品（4章） */
.icon-btn{flex:none;width:44px;height:44px;border:0;border-radius:22px;background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.btn-primary{height:52px;width:100%;border:0;border-radius:26px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:700;cursor:pointer;padding:0 20px}
.btn-primary.lg{height:60px;border-radius:30px;font-size:17px}
.btn-primary.dark{background:var(--on-accent);color:var(--text)}
.btn-primary.light{background:var(--text);color:var(--on-accent)}
.chip-s{height:44px;padding:0 13px;border:0;border-radius:22px;background:var(--surface);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none}
.chip-s[aria-pressed=true]{background:var(--text);color:var(--on-accent)}
.card-s{background:var(--surface);border-radius:var(--r-card);padding:20px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sec-head a,.sec-head button.link{font-size:13px;line-height:20px;color:var(--text-muted);background:none;border:0;cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0}
.list-row{min-height:52px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--surface-raised)}
.list-row:last-child{border-bottom:0}

/* タブバー */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--surface-raised);padding:0 12px env(safe-area-inset-bottom)}
#tabbar .in{max-width:512px;margin:0 auto;height:var(--tabbar-h);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
#tabbar a{letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--text-muted)}
#tabbar a[aria-current=page]{font-weight:700;color:var(--text)}
body.no-tabbar #tabbar{display:none}

/* 英語の見出し（太いコンデンス体） */
.nk{font-family:"Bebas Neue","Anton","Noto Sans JP",sans-serif!important;font-weight:400!important;font-style:italic;font-synthesis:style;text-transform:uppercase;letter-spacing:.01em;padding-right:.08em}
.t-title.nk{font-size:54px;line-height:52px}.t-menu.nk{font-size:50px;line-height:48px}.w-title h1.nk{font-size:54px;line-height:52px}
.up{text-transform:uppercase;letter-spacing:.04em}
.logo{display:inline-flex;align-items:center;gap:.22em;font-family:"Bebas Neue","Anton",sans-serif;font-style:italic;font-synthesis:style;line-height:1;letter-spacing:.02em;color:var(--text);white-space:nowrap}
.title-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.foot-logo{margin-top:36px;padding-top:24px;border-top:1px solid var(--surface-raised);display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-muted);font-size:11px;letter-spacing:.14em}
/* ホーム（5.1） */
.eyebrow{font-size:11px;line-height:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.t-section .ja{margin-left:8px;font-size:11px;font-weight:500;color:var(--text-muted);letter-spacing:0}
.t-section{letter-spacing:.14em}
.menu-card{position:relative;overflow:hidden}.menu-card>*{position:relative}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-6px -4px 0 0}
.menu-card .btn-primary{letter-spacing:.06em}
.home-list .kind{flex:none;width:64px;height:64px;border-radius:var(--r-field);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text)}
.home-list .list-row{min-height:84px}
.home-list .nm{display:flex;flex-direction:column;gap:2px;font-weight:700}.home-list .nm small{font-size:11px;line-height:16px;font-weight:500;color:var(--text-muted)}
.eq-art{display:block}.eq-art .f,.eq-art .f2,.eq-art .s{fill:none;stroke-linecap:round;stroke-linejoin:round}.eq-art .f{stroke:var(--text-muted);stroke-width:4}.eq-art .f2{stroke:var(--bar-muted);stroke-width:3}.eq-art .s{stroke:var(--text);stroke-width:3.5}.eq-art .p{fill:var(--text)}.eq-art .m{fill:var(--bar-muted)}.eq-art .d{fill:var(--track)}.eq-art .a{fill:var(--accent)}.eq-art .g{fill:var(--text-muted)}.eq-art .h{fill:var(--surface)}
.home-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.home-head>div{display:flex;flex-direction:column;gap:4px}
.week{margin-top:20px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.week>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.week .dow{font-size:10px;font-weight:500;letter-spacing:.08em;color:var(--text-muted)}
.week .day{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
.week .off .day{color:var(--text-muted)}
.week .dot{width:6px;height:6px;border-radius:3px;background:var(--track)}
.week .did .dot{background:var(--accent)}
.week .today .dow{color:var(--text);font-weight:700}
.week .today .day{background:var(--text);color:var(--on-accent);font-weight:700}
.week .today:not(.did) .dot{background:var(--bg)}
.menu-card{margin-top:20px;padding:20px;border-radius:var(--r-card);background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column}
.menu-card .t-label{letter-spacing:.08em}
.menu-card .t-menu{margin-top:6px}
.menu-card .meta2{margin-top:4px;font-size:13px;line-height:18px;font-weight:500}
.menu-card .btn-primary{margin-top:18px}
.home-list{margin-top:8px;display:flex;flex-direction:column}
.home-list .no{width:22px;font-size:13px;font-weight:600;color:var(--text-muted);flex:none}
.home-list .nm{flex:1;font-size:15px;font-weight:500}
.home-list .rt2{font-size:13px;color:var(--text-muted);white-space:nowrap}
.empty-s{padding:32px 0;text-align:center;color:var(--text-muted);font-size:13px;line-height:18px}

/* 回復度 */
.rc{display:flex;flex-direction:column;gap:16px}
.rc-body{display:flex;justify-content:center;gap:8px}.rc-body>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.rc-body svg{width:148px;height:auto;display:block}.rc-body span{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--text-muted)}
.rc-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px}
.rc-row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rc-row .nm{font-size:12px;line-height:16px;font-weight:700;white-space:nowrap}.rc-row .nm small{margin-left:6px;font-size:10px;font-weight:500;color:var(--text-muted);letter-spacing:0}
.rc-row .pc{font-size:13px;line-height:16px;font-weight:700;font-variant-numeric:tabular-nums}
.rc-row .bar{margin-top:3px;height:4px;border-radius:2px;background:var(--track);overflow:hidden}.rc-row .bar i{display:block;height:100%;border-radius:2px}
.rc-row .st{margin-top:4px;font-size:11px;line-height:14px;color:var(--text-muted);white-space:nowrap}
.rc-note{grid-column:1/-1;font-size:12px;line-height:17px;color:var(--text-muted)}

/* ワークアウト記録（5.2） */
body.no-tabbar main{padding-bottom:calc(env(safe-area-inset-bottom) + 190px)}
.w-head{height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.w-head .mid{display:flex;flex-direction:column;align-items:center;text-align:center}
.w-head .nm{font-size:15px;line-height:20px;font-weight:700;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.w-head .eyebrow{color:var(--text-muted);font-size:11px}
.pill{flex:none;height:44px;padding:0 16px;border:0;border-radius:22px;background:var(--surface);color:var(--text);font-size:13px;font-weight:700;letter-spacing:.1em;cursor:pointer}
.segs{margin:12px calc(var(--pad-x) * -1) 0;padding:2px var(--pad-x);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.segs::-webkit-scrollbar{display:none}
.segs button{flex:1 0 40px;padding:0;border:0;background:none;display:flex;flex-direction:column;align-items:stretch;gap:6px;cursor:pointer;color:var(--text-muted)}
.segs button i{height:40px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;opacity:.55}
.segs .cur i{opacity:1;box-shadow:inset 0 0 0 2px var(--text);color:var(--text)}.segs .done i{opacity:.9}
.segs button span{display:block;width:100%;height:4px;border-radius:2px;background:var(--track)}
.segs .done span{background:var(--accent)}.segs .cur span{background:var(--text)}
.w-title{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.w-title>div:first-child{display:flex;flex-direction:column;gap:4px}
.w-title h1{color:var(--accent);margin:0;font-family:"Noto Sans JP",var(--font);font-size:24px;line-height:34px;font-weight:900}
.w-art{flex:none;width:88px;height:88px;border-radius:var(--r-card);background:var(--surface);display:flex;align-items:center;justify-content:center}
.num-grid{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.num-card{padding:16px;border-radius:var(--r-card);background:var(--surface);display:flex;flex-direction:column}
.num-card .t-label{color:var(--text-muted);display:flex;align-items:baseline;gap:8px}.num-card .ja{font-size:11px;font-weight:500}
.num-val{margin-top:8px;display:flex;align-items:baseline;gap:6px}
.num-val span{font-size:15px;font-weight:600;color:var(--text-muted);flex:none}
.unit-btn{flex:none;align-self:center;min-width:40px;height:36px;padding:0 8px;border:0;border-radius:18px;background:var(--surface-raised);color:var(--text);font-size:14px;font-weight:700;cursor:pointer}
.big-in{flex:1;width:100%;min-height:0;height:60px;padding:0;border:0;border-radius:8px;background:none;color:var(--text);font-size:52px;line-height:60px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big-in.sm{font-size:40px}.big-in.xs{font-size:30px}
.pm{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pm button{height:48px;border:0;border-radius:var(--r-field);background:var(--surface-raised);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.set-list{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.set-row{height:44px;padding:0 14px;border:0;border-radius:var(--r-row);display:flex;align-items:center;gap:14px;background:var(--surface);color:var(--text-muted);font:inherit;text-align:left;width:100%}
.set-row .no{width:18px;font-size:13px;font-weight:700}.set-row .tx{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-row.done{color:var(--text);cursor:pointer}.set-row .ck{color:var(--accent)}
.set-row.cur{background:var(--text);color:var(--on-accent)}.set-row .st{font-size:12px;font-weight:700}
.set-add{height:44px;border:1px dashed var(--track);border-radius:var(--r-row);background:none;color:var(--text-muted);font:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%}.set-add svg{width:16px;height:16px}
.w-more{margin-top:20px;border-top:1px solid var(--surface-raised);padding-top:4px}
.w-more summary{min-height:44px;display:flex;align-items:center;font-size:13px;color:var(--text-muted);cursor:pointer;list-style:none}.w-more summary::-webkit-details-marker{display:none}
.w-dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);padding:0 var(--pad-x) calc(env(safe-area-inset-bottom) + 24px)}
.w-dock .in{max-width:512px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.rest-box{height:56px;padding:0 8px 0 18px;border-radius:20px;background:var(--surface);display:flex;align-items:center;gap:12px}
.rest-box .lb{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--text-muted)}
.rest-box .tm{flex:1;font-size:26px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.rest-box button{height:44px;padding:0 16px;border:0;border-radius:var(--r-row);background:var(--surface-raised);color:var(--text);font-size:14px;font-weight:700;cursor:pointer}
.rest-idle{height:56px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-muted);text-align:center}
body.no-tabbar #toast{bottom:calc(env(safe-area-inset-bottom) + 176px)}

/* 種目（5.3） */
.search{margin:16px 0 0;height:48px;padding:0 16px;border-radius:var(--r-field);background:var(--surface);display:flex;align-items:center;gap:10px;color:var(--text-muted)}
.search input{flex:1;height:44px;min-height:0;padding:0;border:0;border-radius:0;outline:0;background:transparent;color:var(--text);font-size:16px}
.chips{margin:16px calc(var(--pad-x) * -1) 0;padding:0 var(--pad-x);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.ex-list{margin-top:12px;display:flex;flex-direction:column;padding-bottom:76px}
.ex-row{min-height:72px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--surface-raised)}.ex-row:last-child{border-bottom:0}
.ex-row .kind{flex:none;width:52px;height:52px;border-radius:var(--r-field);background:var(--surface);display:flex;align-items:center;justify-content:center}.ex-row .kind svg{width:42px;height:42px}.ex-row .kind svg.i{width:24px;height:24px}
.ex-row .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.ex-row .n1{font-size:15px;line-height:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-row .n2{font-size:12px;line-height:16px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-row .add{flex:none;width:44px;height:44px;border:0;border-radius:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--surface-raised);color:var(--text)}
.ex-row .add.on{background:var(--accent);color:var(--on-accent)}.ex-row .add svg{width:18px;height:18px}
.ex-dock{position:fixed;left:0;right:0;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));z-index:4;background:var(--bg);padding:12px var(--pad-x) 16px}
.ex-dock .in{max-width:512px;margin:0 auto}

/* 記録（5.4） */
.p-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--text-muted)}
.p-top .t-label{display:flex;align-items:baseline;gap:8px}.p-top .ja{font-size:11px;font-weight:500}.t-min2{font-size:12px;line-height:16px;white-space:nowrap}
.p-big{margin-top:8px;display:flex;align-items:baseline;gap:8px}.p-big .t-num{line-height:56px}.p-big .u{font-size:17px;font-weight:600;color:var(--text-muted)}
.p-segs{margin-top:14px;display:grid;gap:6px}.p-segs div{height:8px;border-radius:4px;background:var(--track)}.p-segs .on{background:var(--accent)}
.p-bars{margin-top:14px;height:164px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
.p-bars>div{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text-muted)}

/* 回復度（目安）。記録から「部位ごとに、最後にやってからの時間と、そのときの負荷」で推定する。
   普段どおりの負荷で約48時間、普段の1.5倍以上で約72時間、半分以下で約24時間で100%に戻ると見なす */
const MUS=['胸','背中','肩','腕','体幹','脚'];
function musOf(ex){
  if(isCardio(ex))return{'脚':.3};
  const p=partOf(ex);if(!p)return{};const m={[p]:1};
  if(p==='胸'&&/プレス|ディップス|プッシュアップ/.test(ex)){m['肩']=.5;m['腕']=.5}
  if(p==='背中'){if(/デッドリフト/.test(ex))m['脚']=1;else if(/エクステンション/.test(ex))m['脚']=.5;else m['腕']=.5}
  if(p==='脚'&&/スクワット|デッドリフト/.test(ex))m['体幹']=.5;
  if(p==='脚'&&/デッドリフト/.test(ex))m['背中']=.5;
  if(p==='肩'&&/プレス/.test(ex))m['腕']=.5;
  return m;
}
function sessLoad(s){const L={};s.items.forEach(it=>{const n=isC(it)?cMin(it)/10:okSets(it).length;if(!n)return;const m=musOf(it.ex);for(const k in m)L[k]=(L[k]||0)+n*m[k]});return L}
function recovery(){
  const now=Date.now(),H=36e5,hist={},out={};MUS.forEach(m=>{hist[m]=[];out[m]={pct:100,rem:0,trained:false}});
  S.sessions.slice().sort((a,b)=>a.start-b.start).forEach(s=>{const L=sessLoad(s),t=s.end||now;
    MUS.forEach(m=>{const l=L[m];if(!l)return;const h=hist[m],base=h.length>=3?h.reduce((a,b)=>a+b,0)/h.length:6;h.push(l);
      const T=48*Math.min(1.5,Math.max(.5,l/base)),rem=T-(now-t)/H,o=out[m];o.trained=true;o.last=t;
      if(rem>o.rem){o.rem=rem;o.pct=Math.max(0,Math.min(99,Math.round((1-rem/T)*100)))}})});
  return out;
}

function draft(a,it,j){

  const s=it.sets[j],b=j?draft(a,it,j-1):null,prev=lastFor(it.ex,a.id),same=prev&&prev.sets[j]&&prev.sets[j].ok?prev.sets[j]:null,pv=prev&&(prev.sets[j]||prev.sets[prev.sets.length-1]);

function historyHTML(){

  const weekCard=`<div class="card-s"><div class="p-top"><div class="t-label"><span class="eyebrow">This Week</span><span class="ja">今週のワークアウト</span></div><div class="t-min2">目標 週${goal}回</div></div>
  <div class="p-big"><div class="t-num">${nW}</div><div class="u">/ ${goal} 回</div></div>

  const weeks=[...Array(6)].map((_,k)=>{const st=mon-(5-k)*WK,d=new Date(st);return{cur:k===5,lb:k===5?'今週':`${d.getMonth()+1}/${d.getDate()}`,ja:k===5?'今週':`${d.getMonth()+1}月${d.getDate()}日週`,v:ds.filter(s=>s.start>=st&&s.start<st+WK).reduce((t,s)=>t+vol(s),0)/1000*(isLb()?LB:1)}});
  const mx=Math.max(...weeks.map(w=>w.v));
  const volCard=`<div class="card-s" style="margin-top:12px"><div class="p-top"><div class="t-label"><span class="eyebrow">Weekly Volume</span><span class="ja">週ごとの総負荷量</span></div><div class="t-min2">単位 ${isLb()?'1,000 lb':'t'}</div></div>
  <div class="p-bars" role="img" aria-label="直近6週間の総負荷量。${weeks.map(w=>`${w.ja} ${w.v.toFixed(1)}${isLb()?'千ポンド':'トン'}`).join('、')}">${weeks.map(w=>`<div class="${w.cur?'cur':''}"><div class="v">${w.v.toFixed(1)}</div><div class="b${w.v?'':' z'}" style="height:${w.v?Math.max(6,Math.round(w.v/mx*120)):4}px"></div><div class="d">${w.lb}</div></div>`).join('')}</div></div>`;
  const pb={};ds.forEach(s=>s.items.forEach(it=>{if(isC(it))return;okSets(it).forEach(x=>{const v=e1(+x.w||0,+x.r);if(+x.w>0&&(!pb[it.ex]||v>pb[it.ex].v))pb[it.ex]={v,w:x.w,r:x.r,t:s.start}})}));
  const pbs=Object.entries(pb).sort((a,b)=>b[1].t-a[1].t);
  const pbHTML=pbs.length?pbs.map(([ex,b])=>{const d=new Date(b.t),en=EN_EX[ex];return `<div class="pb-row"><div class="tx"><div class="n1${en?' up':''}">${esc(en||ex)}</div><div class="n2">${en?esc(ex)+' ・ ':''}${d.getMonth()+1}月${d.getDate()}日</div></div><div class="val">${fmtW(b.w)} × ${esc(b.r)}</div></div>`}).join(''):'<div class="empty-s">ワークアウトを終了すると、種目ごとの自己ベストがここに並びます</div>';
  const cnt={};ds.forEach(s=>s.items.forEach(it=>{if(okSets(it).length)cnt[it.ex]=(cnt[it.ex]||0)+1}));
  const exs=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);if(!cnt[histEx])histEx=exs[0]||'';
  let extra='';
  if(ds.length){const sr=series(histEx);let best=0,bw='';
    if(sr.kind==='str')ds.forEach(s=>s.items.forEach(it=>{if(it.ex===histEx&&!isC(it))okSets(it).forEach(x=>{const v=e1(+x.w,+x.r);if(v>best){best=v;bw=`${fmtW(x.w)} × ${x.r}`}})}));
    const bestTxt=sr.kind==='str'?(best?`ベスト ${toU(best)} ${unit()}（${esc(bw)}から推定）`:''):sr.pts.length?`最長 ${+Math.max(...sr.pts.map(p=>p.v)).toFixed(2)}${sr.unit} ・ 合計 ${+sr.pts.reduce((a,p)=>a+p.v,0).toFixed(1)}${sr.unit}`:'';
    const list=ds.map(s=>`<details class="h-item"><summary><div class="tx"><div class="n1${EN_MENU[s.name]?' up':''}">${esc(EN_MENU[s.name]||s.name)}</div><div class="n2">${fmtD(s.start)} ・ ${s.items.length}種目 ・ ${volTxt(vol(s))}${sMin(s)?` ・ 有酸素${+sMin(s).toFixed(1)}分`:''} ・ ${Math.round((s.end-s.start)/6e4)}分</div></div><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
    <ol class="ex">${s.items.map(it=>`<li>${esc(it.ex)} <span>${esc(setTxt(it))||'記録なし'}</span></li>`).join('')}</ol>
    <div class="row" style="margin:10px 0 14px"><button class="btn sm" data-act="delsess" data-id="${s.id}">この記録を削除</button></div></details>`).join('');
    extra=`<h2 class="t-section" style="margin-top:28px">TREND<span class="ja">種目ごとの推移</span></h2>
    <div class="card-s" style="margin-top:8px"><select id="histEx" aria-label="種目">${exs.map(e=>`<option value="${esc(e)}"${e===histEx?' selected':''}>${esc(EN_EX[e]?EN_EX[e].toUpperCase()+'  '+e:e)}</option>`).join('')}</select>
    <div class="t-label" style="margin-top:14px;color:var(--text-muted)">${sr.title}</div><div class="t-sub">${bestTxt}</div>
    <div class="fig"><svg id="chart"></svg></div><div class="t-sub">${sr.note}</div></div>
    <h2 class="t-section" style="margin-top:28px">HISTORY<span class="ja">これまでの記録</span></h2><div style="margin-top:8px">${list}</div>`}
  return `${titleRow('Progress')}<div style="height:16px"></div>${weekCard}${volCard}
  <h2 class="t-section" style="margin-top:24px">PERSONAL BESTS<span class="ja">自己ベスト</span></h2><div style="margin-top:8px">${pbHTML}</div>${extra}`;
}
function series(ex){
  const ss=done().slice().reverse(),its=s=>s.items.filter(it=>it.ex===ex);
  const cardio=ss.some(s=>its(s).some(isC));
  if(!cardio)return{kind:'str',title:'推定1RMの推移',unit:unit(),note:'推定1RM = 重量 ×（1 + 回数 ÷ 30）。各回の最高値を結んでいます。',
    pts:ss.map(s=>{let v=0;its(s).forEach(it=>okSets(it).forEach(k=>{v=Math.max(v,e1(+k.w,+k.r||0))}));return{t:s.start,v:isLb()?v*LB:v}}).filter(p=>p.v>0)};
  const useKm=ss.some(s=>its(s).some(it=>cKm(it)>0)),f=useKm?cKm:cMin;
  return{kind:useKm?'km':'min',title:useKm?'距離の推移':'時間の推移',unit:useKm?'km':'分',note:useKm?'各回の合計距離（km）です。':'各回の合計時間（分）です。距離も入れると距離のグラフになります。',
    pts:ss.map(s=>({t:s.start,v:its(s).reduce((a,it)=>a+f(it),0)})).filter(p=>p.v>0)};
}
function drawChart(){
  const s=$('#chart');if(!s)return;const W=s.clientWidth,H=s.clientHeight;if(!W)return;
  const pts=series(histEx).pts;
  if(pts.length<2){s.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="currentColor" opacity=".6" font-size="14">2回以上記録するとグラフになります</text>`;return}
  const L=44,R=18,T=18,B=28,lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v)),pad=Math.max((hi-lo)*.15,hi*.04,.2),y0=lo-pad,y1=hi+pad;
  const X=i=>L+i*(W-L-R)/(pts.length-1),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const ticks=[y0+pad,(lo+hi)/2,hi].filter((v,i,a)=>i===0||Math.abs(v-a[i-1])>hi*.02);
  s.innerHTML=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" opacity=".12"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="currentColor" opacity=".6">${hi<20?+v.toFixed(1):Math.round(v)}</text>`).join('')+
  `<path d="${pts.map((p,i)=>(i?'L':'M')+X(i)+' '+Y(p.v)).join('')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`+
  pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="${W<520?3:4}" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join('')+
  `<text x="${L}" y="${H-8}" font-size="12" fill="currentColor" opacity=".6">${fmtD(pts[0].t)}</text><text x="${W-R}" y="${H-8}" text-anchor="end" font-size="12" fill="currentColor" opacity=".6">${fmtD(pts[pts.length-1].t)}</text>`;
}
const chartRO=new ResizeObserver(drawChart);

  ${r.items.map((it,k)=>`<div class="rt"><input list="exlist" data-r="${ri}" data-k="${k}" data-f="ex" value="${esc(it.ex)}" aria-label="種目"><input inputmode="numeric" data-r="${ri}" data-k="${k}" data-f="sets" value="${esc(it.sets)}" aria-label="セット数"><input data-r="${ri}" data-k="${k}" data-f="reps" value="${esc(it.reps)}" aria-label="回数"><button class="ico" data-act="rmri" data-r="${ri}" data-k="${k}" aria-label="種目を外す">×</button></div>`).join('')}
  <div class="row" style="margin-top:10px;justify-content:space-between"><div class="row"><button class="btn sm" data-act="addri" data-r="${ri}">＋ 種目</button>${REST_ON?`<label style="margin:0">レスト<input inputmode="numeric" data-r="${ri}" data-f="rest" value="${esc(r.rest||S.config.rest)}" style="width:5em;display:inline-block;margin-left:6px" aria-label="レスト秒"> 秒</label>`:''}</div><button class="btn sm dark" data-act="start" data-rid="${r.id}">開始</button></div></div>`).join('');
  const pre=PRESETS.map(r=>`<div class="card"><h2>${esc(r.name)}</h2><div class="meta">${esc(r.note)}</div><ol class="ex">${r.items.map(i=>`<li>${esc(i.ex)} <span>${i.sets}×${i.reps}</span></li>`).join('')}</ol>${REST_ON?`<div class="meta">レスト ${r.rest}秒</div>`:''}<div class="row"><button class="btn sm" data-act="copyr" data-rid="${r.id}">コピーして編集</button><button class="btn sm dark" data-act="start" data-rid="${r.id}">開始</button></div></div>`).join('');
  return `<h2 class="t-section" style="margin-top:28px">ROUTINES<span class="ja">ルーティン</span></h2><p class="lead" style="margin-top:6px">よくやるメニューを保存しておくと、開始時に種目と目標セットが並びます。重量は前回の記録が薄く表示されます。</p>
  <h3 style="margin-top:8px">マイルーティン</h3>${mine||'<div class="empty-note" style="margin-bottom:12px">まだありません。下のおすすめをコピーするのが早いです。</div>'}
  <button class="btn" data-act="newr">＋ 新しいルーティン</button>
  <h3>おすすめテンプレート</h3><div class="grid">${pre}</div>`;
}

/* 描画 */
function render(force=true){
  const ae=document.activeElement;
  if(!force&&ae&&ae.matches&&ae.matches('main input,main textarea,main select')){pending=true;return}
  pending=false;
  $('#exlist').innerHTML=allEx().map(e=>`<option value="${esc(e)}">`).join('');
  if(tab==='workout'&&!active())tab='home';
  document.body.classList.toggle('no-tabbar',tab==='workout');
  document.querySelectorAll('#tabbar a').forEach(x=>{if(x.dataset.tab===tab)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});
  main.innerHTML=tab==='recovery'?recoveryHTML():tab==='progress'?historyHTML():tab==='settings'?settingsHTML():tab==='exercises'?exercisesHTML():tab==='workout'?todayHTML():homeHTML();
  {const c=$('.segs .cur');if(c&&c.parentNode.scrollWidth>c.parentNode.clientWidth)c.parentNode.scrollLeft=c.offsetLeft-c.parentNode.clientWidth/2+c.clientWidth/2}
  chartRO.disconnect();const c=$('#chart');if(c){chartRO.observe(c);drawChart()}
}
const LEGACY={today:'workout',history:'progress',setup:'settings',routines:'settings'};
function route(){let h=location.hash.slice(1);h=LEGACY[h]||h;tab=['home','workout','exercises','recovery','progress','settings'].includes(h)?h:'home';if(tab==='exercises')exPick=null;render();scrollTo(0,0);main.classList.remove('enter');void main.offsetWidth;main.classList.add('enter')}
addEventListener('hashchange',route);
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending)render(false)},0));

/* レストタイマー */
let restEnd=0,beeped=false;
/* 休憩タイマーは一旦オフ。戻すときは REST_ON を true にする（データの rest 項目は残してある） */
const REST_ON=false;
function startRest(sec){if(REST_ON)restEnd=Date.now()+sec*1000}
function tick(){
  const a=active(),el=$('#elapsed');if(a&&el)el.textContent=mmss((Date.now()-a.start)/1000);
  if(!restEnd)return;const left=(restEnd-Date.now())/1000,rt=$('#restT');
  if(left>0){if(rt)rt.textContent=mmss(left);return}
  restEnd=0;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  if(tab==='workout')render(false);
}
setInterval(tick,1000);

/* 操作 */
function findR(id){return S.config.routines.find(r=>r.id===id)||PRESETS.find(r=>r.id===id)}
function startSession(r){
  if(active()){toast('進行中のワークアウトがあります');location.hash='workout';return}
  const s={id:nid(),start:Date.now(),end:0,name:r?r.name||'ルーティン':'フリー',rest:r?+r.rest||0:0,
    items:(r?r.items:[]).filter(i=>i.ex).map(i=>isCardio(i.ex)?{ex:i.ex,cardio:true,target:String(i.reps),sets:Array.from({length:Math.max(1,+i.sets||1)},()=>({m:'',d:'',lv:'',ok:false}))}:{ex:i.ex,target:`${i.sets}×${i.reps}`,sets:Array.from({length:Math.max(1,+i.sets||3)},()=>({w:'',r:'',ok:false}))})};
  wEx=-1;S.sessions.push(s);save('s_'+s.id);if(tab!=='workout')location.hash='workout';else render();
}
function addCustom(n){if(!allEx().includes(n)){S.config.custom.push(n);save('config')}}
let suEx='';
function openSetup(ex){suEx=ex;const s=S.config.setups[ex]||{};$('#suTitle').textContent=ex;['seat','back','pin','grip','note'].forEach(k=>$('#f-'+k).value=s[k]||'');$('#suDel').style.display=S.config.setups[ex]?'':'none';$('#modal').classList.add('show');$('#f-seat').focus()}
const closeSetup=()=>$('#modal').classList.remove('show');
$('#suCancel').onclick=closeSetup;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSetup()});
$('#suForm').addEventListener('submit',e=>{e.preventDefault();const s={t:Date.now()};['seat','back','pin','grip','note'].forEach(k=>{const v=$('#f-'+k).value.trim();if(v)s[k]=v});S.config.setups[suEx]=s;if(!isEquip(suEx))addCustom(suEx);save('config');closeSetup();render();toast(suEx+' の設定を保存しました')});
$('#suDel').onclick=()=>{const old=S.config.setups[suEx],ex=suEx;delete S.config.setups[ex];save('config');closeSetup();render();toast('設定を削除しました',()=>{S.config.setups[ex]=old;save('config')})};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSetup();if(e.key==='Enter'&&e.target.id==='addEx'){e.preventDefault();act('addex',e.target)}if(e.key==='Enter'&&e.target.id==='suEx'){e.preventDefault();act('suadd',e.target)}if(e.key==='Enter'&&e.target.id==='gEq'){e.preventDefault();act('gymadd',e.target)}});

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b)});
function act(a,b){
  const d=b.dataset,s=active(),i=+d.i,j=+d.j;
  if(a==='start')return startSession(d.rid?findR(d.rid):null);
  if(a==='unit'){S.config.unit=isLb()?'kg':'lb';save('config');render();return toast(`重量の単位を ${unit()} にしました`)}
  if(a==='wgo'){wEx=+d.i;render();return scrollTo(0,0)}
  if(a==='wnext'){wEx=Math.min(s.items.length-1,wEx+1);render();return scrollTo(0,0)}
  if(a==='wundo'){s.items[wEx].sets[+d.j].ok=false;save('s_'+s.id);return render()}
  if(a==='wstep'||a==='wdone'){const it=s.items[wEx],k=it.sets.findIndex(x=>!x.ok);if(k<0)return;const x=it.sets[k],v=draft(s,it,k);
    if(a==='wstep'&&d.f==='w'&&isLb()){{const u=toU(v.w),nx=+d.d>0?Math.floor(u/5)*5+5:Math.ceil(u/5)*5-5;x.w=String(fromU(Math.max(0,nx)))}save('s_'+s.id);return render()}
    if(a==='wstep'){const f=d.f,st=f==='w'?stepOf(it.ex):f==='d'?0.1:1,min=f==='r'||f==='m'?1:0;x[f]=String(Math.max(min,+((+v[f]||0)+st*(+d.d)).toFixed(2)));save('s_'+s.id);return render()}
    if(isC(it)){if(!(v.m>0)){toast('時間（分）を入力してください');return}x.m=String(v.m);x.d=v.d?String(v.d):'';x.lv=v.lv;x.ok=true}
    else{if(!(v.r>0)){toast('回数を入力してください');return}x.w=String(v.w);x.r=String(v.r);x.ok=true;startRest(s.rest||+S.config.rest||90)}
    save('s_'+s.id);return render()}
  if(a==='addset'){const it=s.items[i],l=it.sets[it.sets.length-1];it.sets.push(isC(it)?{m:'',d:'',lv:'',ok:false}:{w:'',r:'',ok:false});save('s_'+s.id);return render()}
  if(a==='rmset'){s.items[i].sets.pop();save('s_'+s.id);return render()}
  if(a==='rmex'){const old=s.items.splice(i,1)[0],sid=s.id;wEx=-1;save('s_'+sid);render();return toast(old.ex+' を外しました',()=>{const t=S.sessions.find(x=>x.id===sid);if(t){t.items.splice(i,0,old);save('s_'+sid)}})}
  if(a==='addex'){const inp=$('#addEx'),n=inp.value.trim();if(!n){inp.focus();return}addCustom(n);s.items.push(isCardio(n)?{ex:n,cardio:true,target:'',sets:[{m:'',d:'',lv:'',ok:false}]}:{ex:n,target:'',sets:[0,1,2].map(()=>({w:'',r:'',ok:false}))});save('s_'+s.id);wEx=s.items.length-1;render();return toast(n+' を追加しました')}
  if(a==='finish'){s.end=Date.now();save('s_'+s.id);restEnd=0;wEx=-1;if(tab==='progress')render();else location.hash='progress';return toast(`お疲れさまでした。${volTxt(vol(s))}${sMin(s)?`・有酸素${+sMin(s).toFixed(1)}分`:''}、${Math.round((s.end-s.start)/6e4)}分`)}
  if(a==='discard'){const k=S.sessions.indexOf(s),old=S.sessions.splice(k,1)[0];save('s_'+old.id);restEnd=0;wEx=-1;render();return toast('記録を破棄しました',()=>{S.sessions.push(old);save('s_'+old.id)})}
  if(a==='delsess'){const k=S.sessions.findIndex(x=>x.id===d.id),old=S.sessions.splice(k,1)[0];save('s_'+old.id);render();return toast(fmtD(old.start)+' の記録を削除しました',()=>{S.sessions.push(old);save('s_'+old.id)})}
  if(a==='setup')return openSetup(d.ex);
  if(a==='gymrm'){const g=myGym(),k=+d.k,old=g.items.splice(k,1)[0];save('config');render();return toast(old.n+' を外しました',()=>{myGym().items.splice(k,0,old);save('config')})}
  if(a==='gymadd'){const n=$('#gEq').value.trim();if(!n){$('#gEq').focus();return}if(isEquip(n)){toast('すでに登録されています');return}myGym().items.push({cat:$('#gCat').value,n,count:1,ex:[]});save('config');render();return toast(n+' を追加しました')}
  if(a==='gymreset'){const old=S.config.gym;S.config.gym=null;save('config');render();return toast('公式の一覧に戻しました',()=>{S.config.gym=old;save('config')})}
  if(a==='suadd'){const n=$('#suEx').value.trim();if(n)openSetup(n);else $('#suEx').focus();return}
  if(a==='reststop'){restEnd=0;return render()}
  if(a==='extog'){const k=exPick.indexOf(d.ex);if(k<0)exPick.push(d.ex);else exPick.splice(k,1);$('#exList').innerHTML=exListHTML();$('#exSave').textContent=exSaveLabel();return}
  if(a==='exgroup'){exGroup=d.g;return render()}
  if(a==='exnew'){const n=exQ.trim();if(!n)return;addCustom(n);if(!exPick.includes(n))exPick.push(n);exQ='';exGroup='すべて';render();return toast(n+' を追加しました')}
  if(a==='exsave'){if(!exPick.length){toast('種目を1つ以上選んでください');return}
    const m=todayMenu(),old=clone(S.config.routines);
    const items=exPick.map(n=>(m&&m.items.find(x=>x.ex===n))||(isCardio(n)?{ex:n,sets:1,reps:'20分'}:{ex:n,sets:3,reps:'10'})).map(clone);
    const mine=m&&S.config.routines.find(r=>r.id===m.id);
    if(mine)mine.items=items;else S.config.routines.push({id:nid(),name:m?m.name:'マイメニュー',rest:m?m.rest:S.config.rest,items});
    save('config');location.hash='home';return toast(`${items.length}種目をメニューに保存しました`,()=>{S.config.routines=old;save('config')})}
  if(a==='newr'){S.config.routines.push({id:nid(),name:'新しいルーティン',rest:S.config.rest,items:[{ex:'',sets:3,reps:'8-10'}]});save('config');return render()}
  if(a==='copyr'){const p=findR(d.rid);S.config.routines.push({...clone(p),id:nid(),name:p.name+'（マイ）'});save('config');render();return toast('マイルーティンにコピーしました')}
  if(a==='rmr'){const ri=+d.r,old=S.config.routines.splice(ri,1)[0];save('config');render();return toast('ルーティンを削除しました',()=>{S.config.routines.splice(ri,0,old);save('config')})}
  if(a==='addri'){S.config.routines[+d.r].items.push({ex:'',sets:3,reps:'10'});save('config');return render()}
  if(a==='rmri'){S.config.routines[+d.r].items.splice(+d.k,1);save('config');return render()}
  if(a==='copy'){const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('コピーしました')).catch(()=>{$('#imp').value=t;$('#imp').select();toast('下の欄のテキストを手動でコピーしてください')});return}
  if(a==='import'){try{const j=JSON.parse($('#imp').value);if(!j||!Array.isArray(j.sessions)||!j.config)throw 0;const old=clone(S);
      S.sessions.forEach(x=>dirty.add('s_'+x.id));S={sessions:j.sessions,config:Object.assign(clone(DEF),j.config)};S.sessions.forEach(x=>dirty.add('s_'+x.id));save('config');render();
      toast('復元しました',()=>{S.sessions.forEach(x=>dirty.add('s_'+x.id));S=old;S.sessions.forEach(x=>dirty.add('s_'+x.id));save('config')})}catch(e){toast('データの形式が正しくありません')}return}
}
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(t.id==='exQ'){exQ=t.value;$('#exList').innerHTML=exListHTML();return}
  if(d.j!==undefined){const s=active();if(!s)return;{const v=t.value.trim();s.items[+d.i].sets[+d.j][d.f]=d.f==='w'&&isLb()&&v!==''?String(fromU(v)):v}save('s_'+s.id);const ct=$('#curTxt');if(ct){const it=s.items[+d.i];ct.innerHTML=rowTxt(it,draft(s,it,+d.j))}}
  else if(d.r!==undefined){const r=S.config.routines[+d.r];if(d.k!==undefined)r.items[+d.k][d.f]=d.f==='sets'?(+t.value||''):t.value;else r[d.f]=d.f==='rest'?(+t.value||''):t.value;save('config')}
  else if(d.g){S.config[d.g]=d.g==='unit'?(t.value==='lb'?'lb':'kg'):+t.value||DEF[d.g];save('config')}
});
document.addEventListener('change',e=>{if(e.target.id==='histEx'){histEx=e.target.value;render()}if(e.target.dataset.f==='ex'&&e.target.value.trim())addCustom(e.target.value.trim())});
addEventListener('pagehide',saveLocal);
route();connect();
/* ブラウザで開いているスマホには、ホーム画面への追加方法を案内する（独立版のみ・一度閉じたら出さない） */
{const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches,ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua),and=/Android/.test(ua);
  let seen=false;try{seen=!!localStorage.getItem('setnote.inst')}catch(e){}
  if(!standalone&&(ios||and)&&!/claude/.test(location.hostname)&&location.protocol==='https:'&&!seen){
    $('#instHow').textContent=ios?'Safari の共有ボタン →「ホーム画面に追加」':'ブラウザのメニュー →「ホーム画面に追加」';$('#inst').classList.add('show');
    $('#instX').onclick=()=>{$('#inst').classList.remove('show');try{localStorage.setItem('setnote.inst','1')}catch(e){}}}}
/* ホーム画面に追加して使う独立版だけ、オフラインでも開けるようにする（claude.ai 上では何もしない） */
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
